services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgv_viaturas
      POSTGRES_USER: sgv_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgv_password_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgv_user -d sgv_viaturas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sgv-network

  backend:
    build:
      context: ./fleet-control-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://pcpe:He9xAdCdKQSBUwa@10.238.118.182:5432/sgv_viaturas?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sgv-network

  frontend:
    build:
      context: ./fleet-control-app
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sgv-network

volumes:
  pgdata:
    name: sgv_pgdata

networks:
  sgv-network:
    name: sgv-network
    driver: bridge