# =============================================================================
# Nginx Configuration — SGV Flutter Web SPA
# =============================================================================
# Flutter Web é uma Single Page Application: todo o roteamento é feito pelo
# cliente (Dart). O Nginx deve servir os arquivos estáticos e redirecionar
# TODAS as requisições de páginas para index.html (SPA fallback).
#
# Estrutura do build Flutter Web:
#   /usr/share/nginx/html/
#   ├── index.html
#   ├── flutter_bootstrap.js
#   ├── main.dart.js
#   ├── flutter_service_worker.js
#   ├── manifest.json
#   ├── version.json
#   ├── flutter.js
#   ├── assets/
#   └── canvaskit/
# =============================================================================

server {
    listen 80;
    server_name _;

    # Raiz dos arquivos estáticos (Flutter Web build)
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # Segurança básica
    # ==========================================================================
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # Proxy reverso para o backend (/api/* → backend:3000)
    # ==========================================================================
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ==========================================================================
    # Cache: HTML — nunca cachear (SPA precisa sempre servir o mais recente)
    # ==========================================================================
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # ==========================================================================
    # Cache: Assets com hash no nome (imutáveis por 1 ano)
    # ==========================================================================
    location ~* \.(js|css|svg|ttf|woff2?|eot|otf|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==========================================================================
    # Cache: Imagens — 30 dias
    # ==========================================================================
    location ~* \.(png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # ==========================================================================
    # Service Worker (PWA) — nunca cachear
    # ==========================================================================
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ==========================================================================
    # Flutter Web SPA — Fallback para index.html
    # Todas as rotas que não corresponderem a arquivos existentes são
    # redirecionadas para index.html para que o roteador Dart resolva.
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # Compressão gzip
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
}