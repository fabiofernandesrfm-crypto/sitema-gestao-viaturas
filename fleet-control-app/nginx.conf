# =============================================================================
# Nginx Configuration — SGV Flutter Web PWA
# =============================================================================
# Estratégia: o frontend é servido pelo nginx e faz proxy reverso para
# o backend na rota /api. Para Easypanel, crie dois serviços separados
# (frontend na porta 80, backend na porta 3000) e use a rede interna
# docker-compose para comunicação entre eles.
# =============================================================================

server {
    listen 80;
    server_name _;

    # Raiz dos arquivos estáticos (Flutter Web build)
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # Segurança básica
    # ==========================================================================
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # Proxy reverso para o backend (/api/* → backend:3000)
    # O hostname "backend" é resolvido pelo Docker DNS interno.
    # Para Easypanel, configure o service name como "backend" no docker-compose.
    # ==========================================================================
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ==========================================================================
    # Flutter Web — SPA fallback + PWA headers
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache headers otimizados para PWA
        location ~* \.(?:html)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* \.(?:js|css|svg|ttf|woff2?|eot|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(?:png|jpg|jpeg|gif|ico|webp)$ {
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    # ==========================================================================
    # Service Worker (PWA) — nunca cachear
    # ==========================================================================
    location ~* /flutter_service_worker\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ==========================================================================
    # Compressão gzip
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;
}